[project]
name = "art-agent"
version = "0.1.0"
description = "Art: AI Role-based Task Agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0.0",
    "mcp>=1.0.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# pre_beta_self_test.py is a standalone smoke script with hard-coded
# /home/jer paths; exclude it from ruff entirely.
[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["tests/pre_beta_self_test.py"]
# B008 (function-call-in-default-arg) is required by FastAPI for Depends().
# PT006 and N802 are intentional in test parametrize names and scenario helpers.
# N806 fires for unittest.mock patches named after the class being patched
# (e.g. \`as MockStore\`); CapWords is the convention there.
# E402 / N806 in tests/pre_beta_self_test.py are excluded entirely below.
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "PT"]
ignore = ["E501", "PT011", "PT012", "N801", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Tests often use Mock* and CamelCase helper names; the asserts and the
# scenarios are documented inside each file.
"tests/**" = ["B008", "N802", "N806", "PT006"]

# FastAPI \`Depends(...)\` as a default arg is the framework's required
# pattern; B008 fires on every endpoint and there is no safe alternative.
"src/api/handlers/**" = ["B008"]

# pre_beta_self_test.py is a standalone smoke script, not a real test
# file. It uses imports below env-var assignments intentionally.
"tests/pre_beta_self_test.py" = ["E402", "F401", "F811"]



[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# pre_beta_self_test.py is a standalone smoke-test script that drives
# the app via TestClient. Its `def test(name, ...)` signature collides
# with pytest's test-function collection rules (the `name` parameter
# looks like a fixture reference). Run it directly with
# `python tests/pre_beta_self_test.py`, not via pytest.
addopts = "--ignore=tests/pre_beta_self_test.py"
